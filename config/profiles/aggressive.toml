# aggressive: looser entry gates and more entries per hour. Per-trade risk (1%), the position cap (50% of
# equity) and the stop band (1% to 2.5%) stay at the defaults.
[strategy.ict]
minNetRr = 1.3          # default 1.5

[detect]
minScore = 3            # default 4

[risk]
maxEntriesPerHour = 10  # default 6
dayLossHalt = 0.15      # default 0.12
